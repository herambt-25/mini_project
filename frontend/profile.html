<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - Smart Gov Schemes</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #004494; }
    </style>
</head>
<body>

    <div class="form-container">
        
        <!-- NEW: Success Message Banner -->
        {% if success_message %}
        <div style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 1px solid #c3e6cb;">
            <strong>{{ success_message }}</strong>
        </div>
        {% endif %}

        <h2 style="text-align: center; color: #333;">Tell us about yourself</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">We need this information to find schemes you are eligible for.</p>
        
        <!-- The form sends a POST request to our /profile route -->
        <form action="/profile" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Rahul Sharma">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" required min="1" max="120" placeholder="e.g. 25">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <select id="state" name="state" required>
                    <option value="">Select State...</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="All">Other / Apply Anywhere</option>
                </select>
            </div>

            <div class="form-group">
                <label for="income">Annual Household Income (₹)</label>
                <input type="number" id="income" name="income" required min="0" placeholder="e.g. 300000">
            </div>

            <div class="form-group">
                <label for="occupation">Occupation</label>
                <select id="occupation" name="occupation" required>
                    <option value="">Select Occupation...</option>
                    <option value="Student">Student</option>
                    <option value="Farmer">Farmer</option>
                    <option value="Artisan">Artisan / Craftsman</option>
                    <option value="Street Vendor">Street Vendor</option>
                    <option value="Unemployed">Unemployed</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit">Save Profile & Find Schemes</button>
        </form>
    </div>

</body>
</html>
